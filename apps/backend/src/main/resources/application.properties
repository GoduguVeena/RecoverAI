server.port=8080
spring.application.name=recoverai-backend

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/recoverai_db}
spring.datasource.username=${DATABASE_USERNAME:recoverai_user}
spring.datasource.password=${DATABASE_PASSWORD:recoverai_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Razorpay Webhook Configuration
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:test_webhook_secret_key_12345}

# ML Service Configuration
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# Gemini Agent Configuration (falls back to FakeAgentModelClient when absent)
gemini.api-key=${GEMINI_API_KEY:}

# Execution Mode (DRY_RUN enforced by DryRunRecoveryExecutionAdapter)
recoverai.execution.mode=${RECOVERAI_EXECUTION_MODE:DRY_RUN}
